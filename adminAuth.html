<!DOCTYPE html>
<html>

<head>
  <title>Admin</title>
  <!-- <link rel="stylesheet" type="text/css" href="slide navbar style.css"> -->
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>

<body>
  <div class="main">
    <input type="checkbox" id="chk" aria-hidden="true" />

    <div class="signup">
      <form onsubmit="register()">
        <label for="chk" aria-hidden="true">Admin Sign up</label>
        <button onclick="continueWithGoogle()"><img src="https://cdn-icons-png.flaticon.com/512/720/720255.png" height="17px" alt="google icon" srcset=""> Continue with google</button>
        <input type="text" id="name" name="name" placeholder="User name" required="" />
        <input type="email" id="email" name="email" placeholder="Email" required="" />
        <input type="number" name="phone" id="phone" placeholder="Phone" required="" />
        <input type="password" name="pswd" id="password" placeholder="Password" required />
        <input type="password" name="pswd" id="cpassword" placeholder="Confirm Password" required="" />
        <button type="submit">Sign up</button>
      </form>
    </div>

    <div class="login">
      <form onsubmit="login()">
        <label for="chk" aria-hidden="true">Login</label>
        <button onclick="continueWithGoogle()"><img src="https://cdn-icons-png.flaticon.com/512/720/720255.png" height="17px" alt="google icon" srcset=""> Continue with google</button>

        <input type="email" id="loginEmail" name="email" placeholder="Email" required="" />
        <input type="password" name="pswd" placeholder="Password" required="" id="loginPass" />
        <button>Login</button>
      </form>
    </div>
  </div>
  <script type="module" src="AdminAuth.js"></script>
</body>

</html>
